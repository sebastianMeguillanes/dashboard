# nginx.conf - CONFIGURACIÓN MEJORADA PARA SPA
events {
  worker_connections  1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # Configuración de logs para debugging
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  # Optimizaciones
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;

  # Compresión GZIP para mejorar performance
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/xhtml+xml
    font/opentype
    font/truetype
    image/svg+xml;

  server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Configuración para servir el favicon desde images
    location = /images/favicon.ico {
      try_files $uri =404;
      log_not_found off;
      access_log off;
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
    }

    # Rechazar solicitudes al favicon.svg si aún existen
    location = /favicon.svg {
      return 404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Configuración de cache para assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # NO cachear el index.html
    location = /index.html {
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";
      add_header Expires "0";
      try_files $uri =404;
    }

    # SPA routing - todas las rutas van a index.html
    location / {
      try_files $uri $uri/ /index.html;
      
      # Headers adicionales para debugging
      add_header X-Debug-Request-URI $request_uri always;
    }

    # Manejo de errores
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
      root /usr/share/nginx/html;
    }

    # Health check endpoint (opcional pero recomendado)
    location /health {
      access_log off;
      return 200 "healthy\n";
      add_header Content-Type text/plain;
    }
  }
}